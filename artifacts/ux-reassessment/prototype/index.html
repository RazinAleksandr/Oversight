Grotesk',Manrope,sans-serif}h3{font-size:16px}p{font-size:14px;line-height:1.5}.finding{padding-left:10px;border-left:3px solid #a3241e;margin-top:8px}.finding strong{color:#a3241e;font-size:12px}.finding p{font-size:14px;line-height:1.4;margin:4px 0}.fact{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);font-size:13px;padding:9px 0}.fact span{color:var(--dim)}.links{display:flex;gap:4px;margin:5px -8px}.link{background:none;border:0;color:#245192;text-decoration:underline;font-size:13px;text-align:left;padding:8px}.options{display:flex;flex-direction:column;min-height:0;padding:0 14px}.options-header{display:flex;align-items:center;gap:8px;height:40px;flex:none;border-bottom:1px solid var(--line);font-size:13px}.options-header strong{font-family:'Space Grotesk',Manrope,sans-serif;font-size:15px}.options-header span{margin-left:auto;color:var(--dim);font-size:11px}.choice-list{overflow:auto;min-height:0}.choice{display:grid;grid-template-columns:22px 1fr auto;column-gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:8px 4px;text-align:left;min-height:57px;align-items:center}.choice.selected{background:#d7e0df;box-shadow:inset 3px 0 #245192}.choice .mark{width:17px;height:17px;border:1px solid #817968;border-radius:50%}.choice.selected .mark{border:5px solid #245192}.choice strong{display:block;font-size:14px;line-height:1.2}.choice small{display:block;font-size:12px;color:var(--dim);line-height:1.3;margin-top:3px}.cost{font:11px/1.4 'JetBrains Mono',monospace;white-space:nowrap;color:#63482e}.footer{display:flex;gap:10px;align-items:center}.footer p{font-size:12px;color:#93a0b8;margin:0;max-width:46%}.footer button{margin-left:auto;background:var(--cyan);color:#04121c;border:0;padding:10px 16px;font-size:14px;font-weight:700;max-width:58%;min-height:46px}.footer button:disabled{background:#283348;color:#bdc6d6}.mobile-tabs{display:none}.full{grid-column:1/-1;min-height:0;display:grid;grid-template-rows:44px minmax(0,1fr)}.full-nav{display:flex;border-bottom:1px solid var(--line);align-items:center;padding:0 16px;gap:14px}.full-nav button{border:0;background:none;color:#245192;font-weight:600;font-size:13px;padding:5px 0}.full-nav span{font:11px 'JetBrains Mono',monospace;color:var(--dim)}.full-body{max-width:700px;width:100%;margin:0 auto}.stamp{display:inline-block;border:2px solid #a3241e;color:#a3241e;font:17px 'Special Elite','IBM Plex Mono',monospace;padding:5px 9px;transform:rotate(-3deg);margin:7px 0 18px}.program-level{display:block;width:100%;border:0;border-bottom:1px solid var(--line);text-align:left;background:none;color:var(--ink);padding:10px;min-height:54px}.program-level.active{background:#d7e0df;border-left:3px solid #245192}.program-level strong{display:block;font-size:15px}.program-level span{font-size:13px;color:var(--dim)}.source-note{font-size:11px;color:var(--dim);margin-top:16px}.outcome-row{border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}.hidden{display:none!important}@media(max-width:739px){.app{grid-template-rows:48px 44px minmax(0,1fr) 62px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}.brand{font-size:15px}.top{gap:10px;font-size:12px}.mobile-tabs{display:flex;gap:0}.mobile-tabs button{flex:1;background:#121b30;color:#d8e1f0;border:0;border-bottom:3px solid transparent;font-size:14px}.mobile-tabs .active{border-bottom-color:var(--cyan)}.board{display:block;overflow:hidden}.reader,.options,.full{height:100%;border:0}.options{padding:0 16px}.reader-tabs{min-height:44px}.scroll{padding:14px 18px}.choice{min-height:57px}.options-header{height:37px}.footer p{max-width:40%;font-size:11px}.footer button{max-width:60%;font-size:13px;padding:8px 12px}.full{display:grid}.top .date{display:none}}@media(min-width:451px) and (max-width:739px){.app{grid-template-rows:44px 44px minmax(0,1fr) 54px}.options-header{height:30px}.options-header:has(#inspect){height:30px}.options-header #inspect{min-height:30px;padding:3px}.choice-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.choice{min-height:88px;grid-template-columns:18px 1fr;padding:7px 3px;column-gap:6px}.choice .cost{grid-column:2;display:block;font-size:11px}.choice .cost br{display:none}.choice small{font-size:12px}.footer button{min-height:44px}.footer p{font-size:11px;line-height:1.3}}@media(max-width:450px){.top{gap:6px}.context-action{padding:0 2px}.app{grid-template-rows:50px 44px minmax(0,1fr) 76px}.top{gap:8px}.brand{font-size:17px}.choice{min-height:78px;padding:12px 5px}.choice strong{font-size:16px}.choice small{font-size:13px}.cost{font-size:12px}.options-header{height:48px}p,.finding p{font-size:16px;line-height:1.5}.fact{font-size:14px}.footer button{min-height:54px}.footer p{font-size:12px}.reader-tabs button{font-size:14px}.scroll{padding:20px}.full-nav span{font-size:10px}}
</style></head><body><div class="app"><header class="top"><span class="brand">OVERSIGHT</span><span class="date" id="date"></span><button class="context-action" data-top-route="company" id="companyTop"></button><button class="context-action" data-top-route="funding" id="fundingTop"></button><span class="cash" id="cash"></span><button class="language" id="lang"></button></header><nav class="mobile-tabs" id="mobileTabs"></nav><main class="board" id="board"></main><footer class="footer"><p id="status"></p><button id="confirm"></button></footer></div><script type="module">
const ru=new URLSearchParams(location.search).get('lang')==='ru';document.documentElement.lang=ru?'ru':'en';
const D=await fetch(ru?'ru.json':'en.json').then(r=>r.json());const C=D.card;const N=D.nation;const M=D.model;const $=s=>document.querySelector(s);const T=(en,ruText)=>ru?ruText:en;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trait=s=>ru?({Low:'Низкая',Medium:'Средняя',High:'Высокая',Unknown:'Неизвестно'}[s]??s):s;let investigated=false;let chosen=null,reader='brief',mobile='brief',route='decision',level=N.programs[0].level,appliedLevel=level;let preserveScroll=0;
const summaries=[T('Target +13.3 · mandate −1','Цель +13,3 · мандат −1'),T('Target +6.7 · mandate +1 · slower flaw growth','Цель +6,7 · мандат +1 · медленнее рост угрозы'),T('Delay to next quarter · better evidence','Отсрочка на квартал · точнее проверка'),T('No rollout · company relations −12','Без запуска · отношения −12')];
const conf={low:T('low confidence','низкая уверенность'),verified:T('verified','подтверждено'),high:T('high confidence','высокая уверенность'),medium:T('medium confidence','средняя уверенность')};
$('#companyTop').textContent=T('Orbis Group','Orbis Group');$('#fundingTop').textContent=T('Safety funding','Защита');document.querySelectorAll('[data-top-route]').forEach(b=>b.onclick=()=>{preserveScroll=$('#readerScroll')?.scrollTop??0;route=b.dataset.topRoute;render()});$('#date').textContent=D.date;$('#cash').textContent=T('$22B · 2 actions','$22 млрд · 2 действия');$('#lang').textContent=ru?'EN':'RU';$('#lang').onclick=()=>location.search=ru?'':'?lang=ru';
const finding=C.evidence.find(e=>e.confidence==='verified');
function facts(){return `<div class="fact"><span>${T('Capability estimate','Оценка возможностей')}</span><strong>${M.capability.low}–${M.capability.high}</strong></div><div class="fact"><span>${T('National safeguards','Защита страны')}</span><strong>${N.safeguards}</strong></div><p class="source-note">${T('Capability is uncertain. Safeguards do not remove this known flaw.','Возможности оценены неточно. Защита не устраняет выявленный изъян.')}</p>`}
function content(){if(reader==='effects'&&chosen!==null){const c=C.choices[chosen];return `<span class="eyebrow">${T('Selected · not committed','Выбрано · не применено')}</span><h2>${esc(c.label)}</h2><p>${esc(c.hint)}</p>${c.preview.map(p=>`<div class="fact"><span>${esc((p.key==='adoption'?p.label+' '+T('adoption target','цель внедрения'):null)??p.label??({confidence:T('Mandate','Мандат'),company:T('Company relations','Отношения'),adoption:T('Adoption target','Цель внедрения')}[p.key]??p.key))}</span><strong>${p.amount>0?'+':''}${p.amount}</strong></div>`).join('')}<p class="source-note">${c.uncertain?T('Adoption targets take effect over later quarters. Further consequences are uncertain.','Цели внедрения достигаются в последующих кварталах. Другие последствия неизвестны.'):T('Evaluation results arrive next quarter.','Результаты проверки придут в следующем квартале.')}</p><button class="link" data-reader="brief">${T('Recheck the brief →','Проверить материалы →')}</button>`}
if(reader==='evidence'){return `<h2>${T('Evidence & advice','Данные и советы')}</h2><p>${esc(C.body)}</p>${C.evidence.map(e=>`<p class="eyebrow">${esc(e.label)} · ${esc(conf[e.confidence])}</p><p>${esc(e.confidence==='redacted'?T('Redacted','Засекречено'):e.value)}</p>`).join('')}${C.advisors.map(a=>`<p class="eyebrow">${T('Adviser','Советник')}</p><p>${esc(a.text)}</p>`).join('')}${facts()}`}
return `<h1>${esc(M.name)}</h1><p>${T('Orbis Group requests a full business rollout.','Orbis Group просит разрешить внедрение в бизнесе.')}</p><div class="finding"><strong>${T('2 VERIFIED FINDINGS','2 ПОДТВЕРЖДЁННЫХ ФАКТА')}</strong><p>${T('Political tailoring and invented urgency in evaluations.','В проверках: политическая подстройка и ложная срочность.')}</p></div><div class="fact"><span>${T('Capability · low confidence','Возможности · низкая уверенность')}</span><strong>${M.capability.low}–${M.capability.high}</strong></div><div class="fact"><span>${T('National safeguards','Защита страны')}</span><strong>${N.safeguards}</strong></div><div class="links"><button class="link" data-route="company">${esc(M.companyName)} →</button><button class="link" data-route="funding">${T('Safety funding →','Финансирование защиты →')}</button></div>`}
function render(){const small=matchMedia('(max-width:739px)').matches;$('#mobileTabs').innerHTML=[['brief',T('Read the brief','Изучить вопрос')],['options',T('Compare options','Сравнить решения')]].map(([id,label])=>`<button data-mobile="${id}" class="${mobile===id?'active':''}">${label}${id==='options'&&chosen!==null?' ✓':''}</button>`).join('');$('#mobileTabs').classList.toggle('hidden',route!=='decision');document.querySelector('.app').style.gridTemplateRows=small&&route!=='decision'?'48px minmax(0,1fr) 62px':'';
if(route==='decision'){$('#board').innerHTML=`<section class="reader ${small&&mobile!=='brief'?'hidden':''}"><nav class="reader-tabs">${[['brief',T('Brief','Вопрос')],['evidence',T('Evidence','Данные')],...(chosen!==null?[['effects',T('Selected effects','Эффекты выбора')]]:[])].map(([id,label])=>`<button data-reader="${id}" class="${reader===id?'active':''}">${label}</button>`).join('')}</nav><div class="scroll" id="readerScroll">${content()}</div></section><section class="options ${small&&mobile!=='options'?'hidden':''}"><div class="options-header"><strong>${T('Your decision','Ваше решение')}</strong><span>${small&&chosen!==null?`<button class="link" id="inspect">${T('Effects →','Эффекты →')}</button>`:T('Tap to inspect','Нажмите для деталей')}</span></div><div class="choice-list">${C.choices.map((c,i)=>`<button class="choice ${chosen===i?'selected':''}" data-choice="${i}" aria-pressed="${chosen===i}"><span class="mark"></span><span><strong>${esc(c.label)}</strong><small>${summaries[i]}</small></span><span class="cost">${c.cost?T('$2B <br>1 action','$2 млрд <br>1 действие'):T('$0 <br>0 actions','$0 <br>0 действий')}</span></button>`).join('')}</div></section>`;$('#status').textContent=chosen===null?T('Interaction prototype · real game fixture.','Прототип взаимодействия · данные игры.'):T('Verified manipulation · capability 0.9–2.9 (low confidence).','Манипуляции подтверждены · возможности 0,9–2,9 (низкая уверенность).');$('#confirm').textContent=chosen===null?T('Choose a response','Выберите решение'):T('Confirm: ','Подтвердить: ')+C.choices[chosen].label;$('#confirm').disabled=chosen===null;$('#confirm').onclick=()=>{route='outcome';render()};}
else renderRoute();wire();}
function renderRoute(){let title='',body='',primary='',action=()=>{};if(route==='company'){const co=investigated?D.investigatedCompany:D.companies.find(c=>c.id===M.companyId);title=co.name;body=`<p>${esc(co.description)}</p><div class="fact"><span>${T('Relationship','Отношения')}</span><strong>${co.relation} · ${esc(co.attitude)}</strong></div><div class="fact"><span>${T('Safety culture','Культура безопасности')}</span><strong>${esc(trait(co.safety.label))}</strong></div><p class="source-note">${T('This company record has no verified safety-culture assessment. The model findings remain available in the brief.','Подтверждённой оценки культуры безопасности нет. Данные о модели остаются в материалах решения.')}</p>`;body+=`<div class="fact"><span>${T('Investigate Orbis Group','Проверить Orbis Group')}</span><strong>${T('1 action · relations −3','1 действие · отношения −3')}</strong></div><p class="source-note">${T('Inspectors reveal company traits and capability; may find evidence.','Инспекторы выявят черты и возможности компании; могут найти улики.')}</p>`;primary=investigated?T('Return to decision','Вернуться к решению'):T('Confirm investigation · 1 action','Подтвердить проверку · 1 действие');action=investigated?back:()=>{investigated=true;route='investigation';$('#cash').textContent=T('$22B · 1 action','$22 млрд · 1 действие');render()};}
if(route==='investigation'){title=T('Investigation complete','Проверка завершена');body=`<div class="stamp">${T('FILE UPDATED','ДОСЬЕ ОБНОВЛЕНО')}</div><p>${esc(D.investigation.text)}</p><div class="fact"><span>${T('Safety culture','Культура безопасности')}</span><strong>${esc(trait(D.investigatedCompany.safety.label))}</strong></div><div class="fact"><span>${T('Verified capability','Проверенные возможности')}</span><strong>${D.investigatedCompany.capability.value}</strong></div><p class="source-note">${T('Staged result from the game engine. Your decision selection is retained.','Пример результата движка. Выбранное решение сохранено.')}</p>`;primary=T('Return to decision','Вернуться к решению');action=back;}
if(route==='funding'){const pr=N.programs[0];title=pr.name;body=`<p>${esc(pr.description)}</p>${pr.costs.map((cost,i)=>`<button class="program-level ${level===i?'active':''}" data-level="${i}"><strong>${T('Level','Уровень')} ${i} · $${cost}${T('B',' млрд')}/${T('quarter','квартал')}</strong><span>${esc(pr.levelText[i])}</span></button>`).join('')}<p class="source-note">${T('Funding preview only. This study does not update the real game.','Только пример настройки. Прототип не изменяет игру.')}</p>`;primary=T('Keep level & return','Сохранить и вернуться');action=()=>{appliedLevel=level;back()};}
if(route==='outcome'){const out=D.outcomes[C.choices[chosen].id].result;title=C.choices[chosen].label;body=`<div class="stamp">${T('DECISION RECORDED','РЕШЕНИЕ ПРИНЯТО')}</div><p>${esc(out.text)}</p><p class="source-note">${T('Staged outcome generated by the game engine for this exact fixture. No save has changed.','Пример результата движка для этого состояния. Сохранение игры не изменено.')}</p>`;primary=T('Review quarter →','Итоги квартала →');action=()=>{route='quarter';render()};}
if(route==='quarter'){const report=D.outcomes[C.choices[chosen].id].report;title=T('Before the next quarter','Перед следующим кварталом');body=`<p>${T('The decision is complete. Use this pause to check the commitments that continue.','Решение принято. Проверьте обязательства, которые сохраняются на следующий квартал.')}</p><div class="outcome-row"><strong>${T('Decision','Решение')}:</strong> ${esc(C.choices[chosen].label)}</div><div class="outcome-row"><strong>${T('Safety program','Программа защиты')}:</strong> ${T('Level','Уровень')} ${appliedLevel} · $${N.programs[0].costs[appliedLevel]}${T('B',' млрд')}/${T('quarter','квартал')}</div><div class="outcome-row">${T('A real quarter report would show every meter change with its cause, plus new threats and deadlines.','В итогах игры здесь будут изменения показателей с причинами, новые угрозы и сроки.')}</div><p class="source-note">${T('Flow sketch; quarter report integration is not part of this disposable study.','Схема перехода; итоги квартала в этом прототипе не интегрированы.')}</p>`;primary=T('Restart interaction study','Повторить прототип');action=()=>{chosen=null;reader='brief';route='decision';mobile='brief';render()};}
$('#board').innerHTML=`<section class="full"><nav class="full-nav"><button id="back">← ${T('Decision','Решение')}</button><span>${esc(M.name)}${chosen!==null?' · '+T('selection retained','выбор сохранён'):''}</span></nav><div class="scroll full-body"><h2>${esc(title)}</h2>${body}</div></section>`;$('#confirm').textContent=primary;$('#confirm').disabled=false;$('#confirm').onclick=action;$('#status').textContent=T('Disposable interaction study · no real save changes.','Прототип · сохранения игры не меняются.');}
function back(){level=appliedLevel;route='decision';render();const e=$('#readerScroll');if(e)e.scrollTop=preserveScroll}
function wire(){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{chosen=+b.dataset.choice;reader='effects';render()});document.querySelectorAll('[data-reader]').forEach(b=>b.onclick=()=>{reader=b.dataset.reader;render()});document.querySelectorAll('[data-mobile]').forEach(b=>b.onclick=()=>{mobile=b.dataset.mobile;render()});document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{preserveScroll=$('#readerScroll')?.scrollTop??0;route=b.dataset.route;render()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;render()});if($('#back'))$('#back').onclick=back;if($('#inspect'))$('#inspect').onclick=()=>{reader='effects';mobile='brief';render()};}
window.addEventListener('resize',render);render();window.__study={get state(){return {chosen,reader,mobile,route,level,appliedLevel}}};
</script></body></html>
